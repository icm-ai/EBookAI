name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-backend:
    name: Backend Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Black
      run: black --check backend/

    - name: Run isort
      run: isort --check-only backend/

    - name: Run Flake8
      run: flake8 backend/ --max-line-length=100 --extend-ignore=E203,W503

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y calibre tesseract-ocr

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        pytest backend/tests/ -v --cov=backend/src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage


  test-book-ir:
    name: BookIR Core Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install focused dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF==1.23.8 pytest==7.4.3 black==23.10.1 isort==5.12.0

    - name: Compile BookIR package
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        python -m compileall -q \
          backend/src/book \
          backend/src/api/review.py \
          backend/src/api/gold_review.py \
          backend/src/main.py

    - name: Check BookIR formatting
      run: |
        black --diff --check \
          backend/src/book \
          backend/src/api/review.py \
          backend/src/api/gold_review.py \
          backend/src/main.py \
          backend/tests/test_book_ir.py \
          backend/tests/test_pymupdf_book_adapter.py \
          backend/tests/test_epub_compiler.py \
          backend/tests/test_reconstruction.py \
          backend/tests/test_quality_engine.py \
          backend/tests/test_patch_engine.py \
          backend/tests/test_parser_adapters.py \
          backend/tests/test_parser_orchestrator.py \
          backend/tests/test_review_session.py \
          backend/tests/test_ai_repair_proposals.py \
          backend/tests/test_publication_qa.py \
          backend/tests/test_release_pipeline.py \
          backend/tests/test_golden_corpus.py \
          backend/tests/test_benchmark_corpus.py \
          backend/tests/test_benchmark_runner.py \
          backend/tests/test_benchmark_leaderboard.py \
          backend/tests/test_benchmark_governance.py \
          backend/tests/test_benchmark_change_control.py \
          backend/tests/test_gold_annotations.py \
          backend/tests/test_gold_consensus.py \
          backend/tests/test_gold_review_workbench.py \
          backend/tests/test_review_plan.py \
          backend/tests/test_real_corpus_benchmark.py \
          backend/tests/golden/run_corpus.py
        isort --check-only --diff \
          backend/src/book \
          backend/src/api/review.py \
          backend/src/api/gold_review.py \
          backend/src/main.py \
          backend/tests/test_book_ir.py \
          backend/tests/test_pymupdf_book_adapter.py \
          backend/tests/test_epub_compiler.py \
          backend/tests/test_reconstruction.py \
          backend/tests/test_quality_engine.py \
          backend/tests/test_patch_engine.py \
          backend/tests/test_parser_adapters.py \
          backend/tests/test_parser_orchestrator.py \
          backend/tests/test_review_session.py \
          backend/tests/test_ai_repair_proposals.py \
          backend/tests/test_publication_qa.py \
          backend/tests/test_release_pipeline.py \
          backend/tests/test_golden_corpus.py \
          backend/tests/test_benchmark_corpus.py \
          backend/tests/test_benchmark_runner.py \
          backend/tests/test_benchmark_leaderboard.py \
          backend/tests/test_benchmark_governance.py \
          backend/tests/test_benchmark_change_control.py \
          backend/tests/test_gold_annotations.py \
          backend/tests/test_gold_consensus.py \
          backend/tests/test_gold_review_workbench.py \
          backend/tests/test_review_plan.py \
          backend/tests/test_real_corpus_benchmark.py \
          backend/tests/golden/run_corpus.py

    - name: Run BookIR tests
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        pytest -v \
          backend/tests/test_book_ir.py \
          backend/tests/test_pymupdf_book_adapter.py \
          backend/tests/test_epub_compiler.py \
          backend/tests/test_reconstruction.py \
          backend/tests/test_quality_engine.py \
          backend/tests/test_patch_engine.py \
          backend/tests/test_parser_adapters.py \
          backend/tests/test_parser_orchestrator.py \
          backend/tests/test_review_session.py \
          backend/tests/test_ai_repair_proposals.py \
          backend/tests/test_publication_qa.py \
          backend/tests/test_release_pipeline.py \
          backend/tests/test_golden_corpus.py \
          backend/tests/test_benchmark_corpus.py \
          backend/tests/test_benchmark_runner.py \
          backend/tests/test_benchmark_leaderboard.py \
          backend/tests/test_benchmark_governance.py \
          backend/tests/test_benchmark_change_control.py \
          backend/tests/test_gold_annotations.py \
          backend/tests/test_gold_consensus.py \
          backend/tests/test_gold_review_workbench.py \
          backend/tests/test_review_plan.py \
          backend/tests/test_real_corpus_benchmark.py

  test-epubcheck-release:
    name: EPUBCheck Release Gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install focused test dependency
      run: |
        python -m pip install --upgrade pip
        pip install pytest==7.4.3

    - name: Install EPUBCheck 5.4.0
      run: |
        curl -fsSL \
          https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
          -o /tmp/epubcheck.zip
        unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
        EPUBCHECK_JAR="$(find /tmp/epubcheck -name epubcheck.jar -type f | head -n 1)"
        test -n "$EPUBCHECK_JAR"
        echo "EPUBCHECK_JAR=$EPUBCHECK_JAR" >> "$GITHUB_ENV"
        java -jar "$EPUBCHECK_JAR" --version

    - name: Validate EBookAI release EPUB with EPUBCheck
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        pytest -v \
          backend/tests/test_release_pipeline.py::test_real_epubcheck_accepts_compiler_release_epub

  test-release-attestation:
    name: Release Attestation Gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install focused test dependency
      run: |
        python -m pip install --upgrade pip
        pip install pytest==7.4.3

    - name: Verify real Ed25519 release attestation
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
        EBOOKAI_BUILD_REVISION: ${{ github.sha }}
      run: |
        pytest -v \
          backend/tests/test_release_pipeline.py::test_real_openssl_detached_release_signature

  test-sigstore-release:
    name: Native Sigstore Release Gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Cosign 3.1.3
      uses: sigstore/cosign-installer@v4.1.2
      with:
        cosign-release: 'v3.1.3'

    - name: Install focused test dependency
      run: |
        python -m pip install --upgrade pip
        pip install pytest==7.4.3

    - name: Verify native Sigstore bundle integration
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        cosign version
        pytest -v \
          backend/tests/test_release_pipeline.py::test_real_cosign_native_bundle_with_key

  test-golden-corpus:
    name: Golden Corpus Regression Gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install regression dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF==1.23.8 pytest==7.4.3

    - name: Install EPUBCheck 5.4.0
      run: |
        curl -fsSL \
          https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
          -o /tmp/epubcheck.zip
        unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
        EPUBCHECK_JAR="$(find /tmp/epubcheck -name epubcheck.jar -type f | head -n 1)"
        test -n "$EPUBCHECK_JAR"
        echo "EPUBCHECK_JAR=$EPUBCHECK_JAR" >> "$GITHUB_ENV"

    - name: Run golden corpus regression
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        mkdir -p artifacts/golden-regression
        python backend/tests/golden/run_corpus.py \
          --output artifacts/golden-regression \
          --external-epubcheck

    - name: Upload golden regression evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: golden-regression-evidence
        path: artifacts/golden-regression/
        retention-days: 30

  test-reviewed-accuracy-governance:
    name: Reviewed Accuracy Governance Gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install governed parser dependency
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF==1.23.8

    - name: Run reviewed accuracy governance
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        python -m book.benchmark.cli governance-ci \
          --manifest benchmark/corpus/manifest.json \
          --policy benchmark/governance/policy.json \
          --baseline-registry benchmark/leaderboard/baselines/registry.json \
          --provenance-registry benchmark/corpus/provenance/registry.json \
          --cache .cache/ebookai/governance-corpus \
          --output artifacts/reviewed-accuracy-governance

    - name: Upload reviewed accuracy governance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reviewed-accuracy-governance
        path: artifacts/reviewed-accuracy-governance/
        retention-days: 30

  lint-frontend:
    name: Frontend Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      working-directory: frontend/web
      run: npm ci

    - name: Run ESLint
      working-directory: frontend/web
      run: npm run lint --if-present

    - name: Check formatting
      working-directory: frontend/web
      run: npm run format:check --if-present

    - name: Test Gold Review workbench
      working-directory: frontend/web
      env:
        CI: true
      run: npm test -- --watchAll=false GoldReviewWorkbench.test.js

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      working-directory: frontend/web
      run: npm ci

    - name: Build
      working-directory: frontend/web
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/web/build/
        retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ebookai:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
