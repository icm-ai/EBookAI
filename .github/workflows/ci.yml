name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-backend:
    name: Backend Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Black
      run: black --check backend/

    - name: Run isort
      run: isort --check-only backend/

    - name: Run Flake8
      run: flake8 backend/ --max-line-length=100 --extend-ignore=E203,W503

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y calibre tesseract-ocr

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        pytest backend/tests/ -v --cov=backend/src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage


  test-book-ir:
    name: BookIR Core Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install focused dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF==1.23.8 pytest==7.4.3 black==23.10.1 isort==5.12.0

    - name: Compile BookIR package
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        python -m compileall -q \
          backend/src/book \
          backend/src/api/review.py \
          backend/src/main.py

    - name: Check BookIR formatting
      run: |
        black --diff --check \
          backend/src/book \
          backend/src/api/review.py \
          backend/src/main.py \
          backend/tests/test_book_ir.py \
          backend/tests/test_pymupdf_book_adapter.py \
          backend/tests/test_epub_compiler.py \
          backend/tests/test_reconstruction.py \
          backend/tests/test_quality_engine.py \
          backend/tests/test_patch_engine.py \
          backend/tests/test_parser_adapters.py \
          backend/tests/test_parser_orchestrator.py \
          backend/tests/test_review_session.py
        isort --check-only --diff \
          backend/src/book \
          backend/src/api/review.py \
          backend/src/main.py \
          backend/tests/test_book_ir.py \
          backend/tests/test_pymupdf_book_adapter.py \
          backend/tests/test_epub_compiler.py \
          backend/tests/test_reconstruction.py \
          backend/tests/test_quality_engine.py \
          backend/tests/test_patch_engine.py \
          backend/tests/test_parser_adapters.py \
          backend/tests/test_parser_orchestrator.py \
          backend/tests/test_review_session.py

    - name: Run BookIR tests
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        pytest -v \
          backend/tests/test_book_ir.py \
          backend/tests/test_pymupdf_book_adapter.py \
          backend/tests/test_epub_compiler.py \
          backend/tests/test_reconstruction.py \
          backend/tests/test_quality_engine.py \
          backend/tests/test_patch_engine.py \
          backend/tests/test_parser_adapters.py \
          backend/tests/test_parser_orchestrator.py \
          backend/tests/test_review_session.py

  lint-frontend:
    name: Frontend Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      working-directory: frontend/web
      run: npm ci

    - name: Run ESLint
      working-directory: frontend/web
      run: npm run lint --if-present

    - name: Check formatting
      working-directory: frontend/web
      run: npm run format:check --if-present

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      working-directory: frontend/web
      run: npm ci

    - name: Build
      working-directory: frontend/web
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/web/build/
        retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ebookai:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
