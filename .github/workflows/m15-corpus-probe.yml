name: M15 Corpus Probe

on:
  push:
    branches: [ milestone-15-gold-leaderboard ]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install PyMuPDF==1.23.8
      - name: Probe NIST PDFs
        run: |
          set -euo pipefail
          mkdir -p /tmp/m15
          curl -fL --retry 3 'https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=936225' -o /tmp/m15/ai-rmf.pdf
          curl -fL --retry 3 'https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=957317' -o /tmp/m15/csf-overview.pdf
          curl -fL --retry 3 'https://tsapps.nist.gov/publication/get_pdf.cfm?pub_id=959369' -o /tmp/m15/csf-overview-ja.pdf
          sha256sum /tmp/m15/*.pdf
          python - <<'PY'
          from pathlib import Path
          import fitz
          for path in sorted(Path('/tmp/m15').glob('*.pdf')):
              with fitz.open(path) as doc:
                  print(f"M15_META {path.name} pages={doc.page_count} bytes={path.stat().st_size}")
          PY
