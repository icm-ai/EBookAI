name: Prepare Occam Review Packages

on:
  push:
    branches: [ review/runtime-occam-v1-human-batch ]

permissions:
  contents: read

jobs:
  prepare-review-packages:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install review dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyMuPDF==1.23.8

    - name: Generate independent reviewer packages
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        from book.benchmark.review_batch import ReviewBatch
        from book.benchmark.review_workbench import GoldReviewStore

        batch = ReviewBatch.load(
            Path("benchmark/review-batches/runtime-occam-v1.json")
        )
        store = GoldReviewStore(
            Path("benchmark/corpus/manifest.json"),
            Path("benchmark/corpus/review-plan.json"),
            Path(".cache/ebookai/corpus"),
            Path("artifacts/gold-review-workspace"),
        )
        out = Path("artifacts/runtime-occam-review-packages")
        out.mkdir(parents=True, exist_ok=True)

        manifest = {
            "schema_version": "1",
            "batch_id": batch.batch_id,
            "package_count": 0,
            "packages": [],
        }

        for assignment in batch.assignments:
            for role, reviewer in (
                ("reviewer_a", assignment.reviewer_a),
                ("reviewer_b", assignment.reviewer_b),
            ):
                session = store.create(
                    assignment.document_id,
                    assignment.page_index,
                    backend="pymupdf",
                )
                safe_reviewer = "".join(
                    ch if ch.isalnum() or ch in "-_" else "-"
                    for ch in reviewer
                ).strip("-") or "reviewer"
                package_dir = (
                    out
                    / assignment.document_id
                    / f"page-{assignment.page_index:04d}"
                    / f"{role}-{safe_reviewer}"
                )
                package_dir.mkdir(parents=True, exist_ok=True)
                (package_dir / "source-page.png").write_bytes(
                    store.render_page(session.id, scale=2.0)
                )
                (package_dir / "draft-gold.json").write_text(
                    json.dumps(
                        session.annotation.to_dict(),
                        ensure_ascii=False,
                        indent=2,
                    ) + "\n",
                    encoding="utf-8",
                )
                (package_dir / "parser-bookir.json").write_text(
                    session.book.to_json() + "\n",
                    encoding="utf-8",
                )
                metadata = {
                    "schema_version": "1",
                    "batch_id": batch.batch_id,
                    "document_id": assignment.document_id,
                    "page_index": assignment.page_index,
                    "reviewer": reviewer,
                    "role": role,
                    "session_id": session.id,
                    "review_backend": "pymupdf",
                    "source_sha256": session.source_sha256,
                    "canonical_hash_at_open": session.canonical_hash_at_open,
                    "note": assignment.note,
                }
                (package_dir / "package.json").write_text(
                    json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
                    encoding="utf-8",
                )
                (package_dir / "README.md").write_text(
                    "# Independent gold review\n\n"
                    f"- Reviewer: `{reviewer}`\n"
                    f"- Role: `{role}`\n"
                    f"- Document: `{assignment.document_id}`\n"
                    f"- PDF page index: {assignment.page_index}\n"
                    f"- Session: `{session.id}`\n"
                    f"- Bucket: `{assignment.note.removeprefix('bucket=')}`\n\n"
                    "Review independently from the source-page image. "
                    "Do not inspect the other reviewer's edits before promotion.\n",
                    encoding="utf-8",
                )
                manifest["packages"].append(metadata)
                manifest["package_count"] += 1

        (out / "review-packages.json").write_text(
            json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
            encoding="utf-8",
        )
        print(json.dumps(
            {
                "batch_id": batch.batch_id,
                "assignment_count": len(batch.assignments),
                "package_count": manifest["package_count"],
            },
            ensure_ascii=False,
            indent=2,
        ))
        PY

    - name: Upload review packages and workspace
      uses: actions/upload-artifact@v4
      with:
        name: runtime-occam-v1-human-review
        path: |
          artifacts/runtime-occam-review-packages/
          artifacts/gold-review-workspace/
        retention-days: 30
