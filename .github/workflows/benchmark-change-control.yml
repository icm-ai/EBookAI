name: Benchmark Change Control

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  pull_request_review:
    types: [ submitted, dismissed ]

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-change-control:
    name: Benchmark Change Control
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.pull_request.base.ref == 'main' ||
       github.event.pull_request.base.ref == 'develop')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Resolve base change-control policy
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        mkdir -p artifacts/benchmark-change-control
        if git cat-file -e "$BASE_SHA:benchmark/governance/change-control.json" 2>/dev/null; then
          git show "$BASE_SHA:benchmark/governance/change-control.json"             > artifacts/benchmark-change-control/base-policy.json
        else
          cp benchmark/governance/change-control.json             artifacts/benchmark-change-control/base-policy.json
        fi

    - name: Generate governed benchmark change report
      id: report
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set +e
        python -m book.benchmark.cli change-control-report           --repo .           --base-ref "$BASE_SHA"           --head-ref "$HEAD_SHA"           --policy artifacts/benchmark-change-control/base-policy.json           --output artifacts/benchmark-change-control
        status=$?
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Detect governance-engine changes
      id: engine
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --           .github/workflows/benchmark-change-control.yml           .github/workflows/ci.yml           backend/src/book/benchmark/baseline.py           backend/src/book/benchmark/change_control.py           backend/src/book/benchmark/consensus.py           backend/src/book/benchmark/governance.py           backend/src/book/benchmark/provenance.py)"
        if [ -n "$changed" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" > artifacts/benchmark-change-control/governance-engine-changes.txt
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Fetch pull request reviews
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
            per_page: 100,
          });
          fs.writeFileSync(
            'artifacts/benchmark-change-control/reviews.json',
            JSON.stringify(reviews, null, 2) + '\n'
          );

    - name: Check independent approvals
      id: approvals
      env:
        PYTHONPATH: ${{ github.workspace }}/backend/src
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set +e
        python -m book.benchmark.cli change-control-approvals           artifacts/benchmark-change-control/change-report.json           artifacts/benchmark-change-control/reviews.json           --author "$PR_AUTHOR"           --policy artifacts/benchmark-change-control/base-policy.json           --output artifacts/benchmark-change-control/change-report-with-approvals.md
        status=$?
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Enforce governance-engine approval floor
      id: engine-approval
      if: steps.engine.outputs.changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const workspace = process.env.GITHUB_WORKSPACE;
          const reviews = require(
            workspace + '/artifacts/benchmark-change-control/reviews.json'
          );
          const author = context.payload.pull_request.user.login;
          const latest = new Map();
          for (const review of reviews) {
            const login = review.user && review.user.login;
            if (!login) continue;
            const prior = latest.get(login);
            if (!prior || Number(review.id || 0) >= Number(prior.id || 0)) {
              latest.set(login, review);
            }
          }
          const approvers = [...latest.entries()]
            .filter(([login, review]) =>
              login !== author && String(review.state).toUpperCase() === 'APPROVED'
            )
            .map(([login]) => login)
            .sort();
          core.info('Governance-engine approvers: ' + (approvers.join(', ') || 'none'));
          if (approvers.length < 2) {
            core.setFailed(
              'Governance-engine changes require 2 independent approvals; found ' +
                approvers.length
            );
          }

    - name: Publish PR change-control report
      if: always()
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- ebookai-benchmark-change-control -->';
          const approvedPath =
            'artifacts/benchmark-change-control/change-report-with-approvals.md';
          const basePath = 'artifacts/benchmark-change-control/change-report.md';
          const path = fs.existsSync(approvedPath) ? approvedPath : basePath;
          if (!fs.existsSync(path)) {
            core.warning('Benchmark change-control report was not generated.');
            return;
          }
          const body = fs.readFileSync(path, 'utf8');
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
            per_page: 100,
          });
          const existing = comments.find(
            comment =>
              comment.user &&
              comment.user.type === 'Bot' &&
              String(comment.body || '').includes(marker)
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
          }

    - name: Upload change-control evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-change-control
        path: artifacts/benchmark-change-control/
        retention-days: 30

    - name: Enforce change-control result
      if: always()
      env:
        REPORT_EXIT: ${{ steps.report.outputs.exit_code }}
        APPROVAL_EXIT: ${{ steps.approvals.outputs.exit_code }}
      run: |
        test "${REPORT_EXIT:-1}" = "0"
        test "${APPROVAL_EXIT:-1}" = "0"
